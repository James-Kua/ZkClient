name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.info.productVersion = $v' wails.json > wails.tmp && mv wails.tmp wails.json

      - name: Build
        run: wails build -platform darwin/universal -clean

      - name: Start ZooKeeper
        run: |
          brew install zookeeper
          zkServer start

      - name: Test
        run: go test -v ./...

      - name: Package DMG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dmg
          cp -R build/bin/ZkClient.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname ZkClient -srcfolder dmg -ov -format UDZO "ZkClient-${GITHUB_REF_NAME}.dmg"

      - name: Upload Artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ZkClient-*.dmg

  release:
    runs-on: macos-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
